name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Whisparr major version"
        type: string
        required: true
      version:
        description: "Whisparr version"
        type: string
        required: true

jobs:
  package:
    strategy:
      matrix:
        include:
          - runtime: freebsd-x64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-musl-arm64
            os: ubuntu-latest
          - runtime: linux-musl-x64
            os: ubuntu-latest
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: osx-arm64
            os: ubuntu-latest
          - runtime: osx-x64
            os: ubuntu-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-x86
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          runtime: ${{ matrix.runtime }}
          artifact: build-${{ matrix.runtime }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  image:
    needs: [package, release]
    if: ${{ !cancelled() && needs.package.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      channel: v5-develop
      version: ${{ inputs.version }}
      branch: ${{ inputs.branch }}
      source: artifact
      push: ${{ github.ref_name == 'develop' }}
      commit_tag: true

  release:
    if: ${{ github.ref_name == 'develop' }}
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The changelog step walks PREV_TAG..CUR_TAG and the signed tag is cut
          # from this checkout, so the full commit graph and every tag have to be
          # here; tree:0 fetches that graph without the trees and blobs behind it.
          # fetch-tags is implied by fetch-depth: 0.
          fetch-depth: 0
          filter: tree:0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: release-*
          merge-multiple: true

      # A develop build diffs against the newest non-draft prerelease, taken from
      # the first page of 100 releases; any other branch uses /releases/latest, the
      # newest non-draft, non-prerelease release, which has no window at all.
      - name: Get Previous Release
        id: previous-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A repo with no releases yet makes /releases/latest 404; that is not
          # an error, it just means there is nothing to diff against.
          if [[ "${{ inputs.branch }}" != "develop" ]]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q '.tag_name' || true)
          else
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              -q 'map(select(.prerelease and (.draft | not))) | .[0].tag_name // empty' || true)
          fi

          echo "Previous release: ${tag:-none}"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Enable GPG signing
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_commit_gpgsign: true
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Create signed tag
        run: |
          set -euo pipefail
          tag="v$VERSION"
          # An annotated tag is listed twice: the tag object, then the commit it
          # resolves to on the ^{} line. The commit is what has to match this run;
          # a lightweight tag has only the plain line.
          remote=$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '/\^\{\}$/{p=$1; next} {t=$1} END{print (p ? p : t)}')
          if [[ -z "$remote" ]]; then
            git tag -s "$tag" -m "Release $tag"
            git push origin "$tag"
          elif [[ "$remote" == "$GITHUB_SHA" ]]; then
            echo "Tag $tag already exists at $GITHUB_SHA; skipping"
          else
            echo "Tag $tag already exists at $remote, not $GITHUB_SHA" >&2
            exit 1
          fi
        env:
          VERSION: ${{ inputs.version }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate Commit Changelog
        id: generate-commit-changelog
        run: |
          PREV_TAG="${{ steps.previous-release.outputs.tag_name }}"
          CUR_TAG="v${{ inputs.version }}"
          echo "## What's Changed" > changelog.md
          if [[ -z "$PREV_TAG" ]]; then
            echo "First v5 release." >> changelog.md
          else
            git log "$PREV_TAG..$CUR_TAG" --pretty=format:"- %s (%h) - @%an" >> changelog.md
          fi
          cat changelog.md

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Whisparr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          bodyFile: changelog.md
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.branch == 'develop' }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}